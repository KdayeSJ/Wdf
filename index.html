<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shan-Web · 液态玻璃浏览器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2343e08d'/%3E%3Cstop offset='0.6' stop-color='%230fa958'/%3E%3Cstop offset='1' stop-color='%230b8ad6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='10' r='4' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --ink:#0e2a20;
  --ink-soft:#5b746b;
  --ink-faint:#8ea49b;
  --green:#12a150;
  --green-deep:#0b7a3d;
  --mint:#d6fbe7;
  --glass:linear-gradient(135deg,rgba(255,255,255,.74),rgba(240,252,246,.44) 52%,rgba(255,255,255,.56));
  --line:rgba(255,255,255,.78);
  --shadow:0 24px 60px -26px rgba(14,70,50,.34),0 2px 10px -4px rgba(14,70,50,.14);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:#eff8f3}
body{
  margin:0;
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:#eff8f3;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* ---------- 背景：液态光场 ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(1100px 760px at 10% 6%, #d5f9e6 0%, rgba(213,249,230,0) 62%),
    radial-gradient(980px 700px at 88% 12%, #dbe9ff 0%, rgba(219,233,255,0) 62%),
    radial-gradient(900px 860px at 74% 98%, #fbf1df 0%, rgba(251,241,223,0) 64%),
    radial-gradient(760px 660px at 16% 92%, #e2f3ff 0%, rgba(226,243,255,0) 66%),
    linear-gradient(158deg,#f5fcf8 0%,#eef4fe 54%,#fdf8f1 100%);
}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.72;mix-blend-mode:multiply;animation:drift 22s ease-in-out infinite}
.blob.b1{width:440px;height:440px;left:-7%;top:8%;background:radial-gradient(circle at 35% 35%,#9ff0c4,#e2fff2 72%)}
.blob.b2{width:400px;height:400px;right:0%;top:2%;background:radial-gradient(circle at 60% 40%,#b6d6ff,#eaf2ff 72%);animation-delay:-7s}
.blob.b3{width:480px;height:480px;right:12%;bottom:-16%;background:radial-gradient(circle at 40% 60%,#ffd8ab,#fff6e9 72%);animation-delay:-13s}
.blob.b4{width:320px;height:320px;left:22%;bottom:-10%;background:radial-gradient(circle at 50% 50%,#c9f0ff,#f2fbff 72%);animation-delay:-4s}
@keyframes drift{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(46px,-38px,0) scale(1.08)}
  66%{transform:translate3d(-34px,30px,0) scale(.96)}
}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(130% 100% at 50% 0%,rgba(255,255,255,0) 52%,rgba(9,86,58,.10) 100%)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/></filter><rect width='180' height='180' filter='n'/></svg>");
}

/* ---------- 玻璃基础 ---------- */
.glass{
  position:relative;
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.7);
  backdrop-filter:blur(26px) saturate(1.7);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(255,255,255,.4);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background:linear-gradient(102deg,rgba(255,255,255,0) 8%,rgba(56,214,140,.20) 32%,rgba(120,198,255,.22) 52%,rgba(255,255,255,0) 76%);
  background-size:240% 100%;animation:flow 14s linear infinite}
@keyframes flow{from{background-position:130% 0}to{background-position:-130% 0}}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.24));
  opacity:.75;
}

/* ---------- 布局 ---------- */
.app{position:relative;z-index:2;height:100vh;max-width:1420px;margin:0 auto;
  display:flex;flex-direction:column;gap:11px;padding:14px 20px 14px}
.topbar{display:flex;align-items:center;gap:10px;min-height:46px}
.brand{display:flex;align-items:center;gap:9px;padding-right:6px;flex:none;user-select:none}
.logo{width:30px;height:30px;border-radius:11px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#3fe089,#0fa958 60%,#0b8ad6);
  box-shadow:0 6px 16px -6px rgba(12,120,70,.7),inset 0 1px 2px rgba(255,255,255,.8)}
.logo span{position:absolute;inset:0;background:
  radial-gradient(60% 40% at 30% 22%,rgba(255,255,255,.9),transparent 70%),
  radial-gradient(40% 30% at 72% 82%,rgba(255,255,255,.35),transparent 70%)}
.brand b{font-size:14.5px;letter-spacing:.2px;font-weight:700}
.brand i{font-style:normal;font-size:11px;color:var(--ink-faint);letter-spacing:.6px;text-transform:uppercase}
.tabs{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:9px;flex:0 1 208px;min-width:120px;
  height:40px;padding:0 10px 0 14px;border-radius:15px;cursor:pointer;transition:.32s cubic-bezier(.2,.8,.2,1);
  background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 4px 14px -10px rgba(12,60,44,.4);
}
.tab:hover{background:rgba(255,255,255,.5)}
.tab.active{background:rgba(255,255,255,.74);border-color:#fff;
  box-shadow:0 10px 24px -14px rgba(12,70,50,.55),inset 0 1px 0 #fff}
.tab .dot{width:7px;height:7px;border-radius:50%;background:#0fa958;flex:none;opacity:.9;box-shadow:0 0 0 3px rgba(15,169,88,.12)}
.tab.loading .dot{background:conic-gradient(#0fa958,#7ee2b2,#0fa958);animation:spin 1s linear infinite;box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tab .name{flex:1;min-width:0;font-size:12.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#28443a}
.tab .x{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#849b91;flex:none;transition:.2s}
.tab .x:hover{background:rgba(15,169,88,.14);color:#0b7a3d}
.newtab{width:34px;height:34px;flex:none;border-radius:12px;border:1px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.4);backdrop-filter:blur(16px);color:#0b7a3d;font-size:17px;cursor:pointer;transition:.28s;
  display:grid;place-items:center}
.newtab:hover{background:#fff;transform:translateY(-1px);box-shadow:0 10px 18px -12px rgba(11,122,61,.7)}

/* 地址栏 */
.navbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:22px}
.navbtn{width:34px;height:34px;border-radius:11px;border:0;background:rgba(255,255,255,.4);color:#2c4a40;cursor:pointer;
  display:grid;place-items:center;transition:.25s;flex:none}
.navbtn:hover:not(:disabled){background:#fff;color:#0b7a3d;transform:translateY(-1px);box-shadow:0 8px 16px -12px rgba(11,122,61,.8)}
.navbtn:disabled{opacity:.34;cursor:default}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 15px;border-radius:999px;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1px 3px rgba(20,70,55,.06),inset 0 -1px 0 rgba(255,255,255,.8);
  transition:.32s cubic-bezier(.2,.8,.2,1)}
.addr:focus-within{background:#fff;box-shadow:0 0 0 4px rgba(18,161,80,.14),inset 0 1px 2px rgba(20,70,55,.05)}
.addr .shield{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:9px;
  background:linear-gradient(140deg,#20c07a,#0b8a4a);color:#fff;box-shadow:0 4px 10px -5px rgba(11,138,74,.9)}
.addr input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 14px/1 inherit;color:#16352a;letter-spacing:.1px}
.addr input::placeholder{color:#9fb3aa;font-weight:400}
.kbd{font-size:10px;color:#9ab0a6;border:1px solid rgba(20,70,55,.12);border-bottom-width:2px;border-radius:6px;padding:2px 6px;flex:none;background:rgba(255,255,255,.5)}
.go{flex:none;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(140deg,#2dd07f,#0b8a4a);display:grid;place-items:center;
  box-shadow:0 10px 20px -10px rgba(11,138,74,.9),inset 0 1px 0 rgba(255,255,255,.6);transition:.3s}
.go:hover{transform:scale(1.06) rotate(6deg)}
.go:active{transform:scale(.96)}
.switch{flex:none;display:flex;align-items:center;gap:9px;padding:7px 12px 7px 10px;border-radius:999px;cursor:pointer;user-select:none;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);transition:.3s}
.switch:hover{background:#fff}
.switch .txt{font-size:12px;color:#3a5a4e;white-space:nowrap}
.switch .txt b{color:#0b7a3d;font-weight:700}
.track{width:38px;height:21px;border-radius:999px;background:linear-gradient(120deg,#1fc97b,#0b8a4a);position:relative;transition:.35s;box-shadow:inset 0 1px 3px rgba(0,0,0,.16)}
.track.off{background:linear-gradient(120deg,#c9d6d0,#aebfb6)}
.knob{position:absolute;top:2.4px;left:2.4px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.35s cubic-bezier(.3,.9,.3,1.3);box-shadow:0 2px 6px rgba(0,0,0,.22)}
.track:not(.off) .knob{left:19.6px}

/* 内容区 */
.stage{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(15,120,80,.22) transparent;padding:2px 2px 20px}
.stage::-webkit-scrollbar{width:9px}
.stage::-webkit-scrollbar-thumb{background:rgba(15,120,80,.18);border-radius:9px;border:2px solid transparent;background-clip:content-box}

/* 首页 */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 8px 60px;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:#5d7a6d;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);padding:7px 13px;border-radius:999px;backdrop-filter:blur(14px)}
.eyebrow .live{width:6px;height:6px;border-radius:50%;background:#12a150;box-shadow:0 0 0 3px rgba(18,161,80,.16);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(18,161,80,.16)}50%{box-shadow:0 0 0 7px rgba(18,161,80,.04)}}
.hero-title{margin:22px 0 8px;text-align:center;font-size:clamp(30px,4.4vw,54px);line-height:1.12;font-weight:900;letter-spacing:-.5px}
.hero-title em{font-style:normal;background:linear-gradient(96deg,#0b8a4a 0%,#12a150 38%,#0b8ad6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{margin:0 0 30px;font-size:14px;color:#688075;text-align:center;letter-spacing:.2px}
.searchbox{position:relative;width:min(760px,94%);border-radius:30px;padding:7px 8px 7px 10px;display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.45));
  border:1px solid #fff;-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:0 34px 70px -34px rgba(12,80,55,.45),0 6px 18px -12px rgba(12,80,55,.25),inset 0 1px 0 #fff;
  transition:.4s cubic-bezier(.2,.8,.2,1)}
.searchbox:focus-within{transform:translateY(-2px);box-shadow:0 46px 90px -40px rgba(12,90,60,.5),0 0 0 4px rgba(18,161,80,.13),inset 0 1px 0 #fff}
.sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(220px 160px at var(--mx,50%) var(--my,0%),rgba(255,255,255,.5),transparent 70%);mix-blend-mode:screen;opacity:.9}
.searchbox .bing{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;border-right:1px solid rgba(20,70,55,.1);height:38px}
.bing-mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,#38d98d,#0b8a4a);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -8px rgba(11,138,74,.9)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 16px/1 inherit;color:#14322a;padding:12px 6px}
.searchbox input::placeholder{color:#a3b7ad;font-weight:400}
.sbtn{flex:none;height:42px;padding:0 20px;border:0;border-radius:22px;color:#fff;cursor:pointer;font:700 13.5px/1 inherit;letter-spacing:.5px;
  background:linear-gradient(135deg,#2fd683,#0b8a4a);box-shadow:0 14px 26px -12px rgba(11,138,74,.85),inset 0 1px 0 rgba(255,255,255,.55);transition:.3s}
.sbtn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.sbtn:active{transform:translateY(0) scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:26px;max-width:760px}
.chip{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5);color:#3d5c50;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:.28s}
.chip:hover{background:#fff;color:#0b7a3d;transform:translateY(-2px);box-shadow:0 12px 22px -16px rgba(11,122,61,.8)}
.stats{display:flex;gap:26px;margin-top:44px;flex-wrap:wrap;justify-content:center;font-size:12px;color:#728a80}
.stats .s{display:flex;align-items:center;gap:7px}
.stats b{color:#123b2c;font-size:15px;font-weight:700}

/* 搜索结果 */
.results-wrap{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:18px;padding:6px 2px 0;animation:fadeUp .55s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.results-head{display:flex;align-items:baseline;gap:12px;padding:6px 6px 12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
.results-head .q{color:#0b7a3d}
.results-head .meta{font-size:12px;color:#8ba196}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:999px;background:rgba(221,250,235,.85);color:#0b7a3d;border:1px solid rgba(18,161,80,.18)}
.verdict.off{background:rgba(255,238,238,.8);color:#b1584f;border-color:rgba(200,90,80,.2)}
.results-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
@media (max-width:1180px){.results-list{grid-template-columns:minmax(0,1fr)}}
.rcard{position:relative;padding:14px 17px 15px;border-radius:19px;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.56));
  border:1px solid rgba(255,255,255,.72);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:0 14px 32px -26px rgba(12,70,50,.55);
  transition:.34s cubic-bezier(.2,.8,.2,1);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.rcard:hover{transform:translateY(-3px);background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.5));border-color:#fff;
  box-shadow:0 26px 54px -30px rgba(12,80,55,.5),inset 0 1px 0 #fff}
.rcard .src-line{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.favi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.src{font-size:11.8px;color:#7b9489;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adbadge{font-size:10px;color:#a8635b;background:rgba(255,236,233,.9);border:1px solid rgba(200,110,95,.22);border-radius:6px;padding:1px 6px}
.rtitle{margin:0 0 5px;font-size:15px;line-height:1.42;font-weight:650;color:#123a2c;letter-spacing:-.1px}
.rcard:hover .rtitle{color:#0b8a4a}
.rsnip{margin:0;font-size:12.4px;line-height:1.66;color:#4b6a5d;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%) translateX(-4px);opacity:0;color:#12a150;transition:.3s}
.rcard:hover .arrow{opacity:1;transform:translateY(-50%)}

/* 分页 */
.pager{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:18px 4px 10px}
.pbtn{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:12px;padding:9px 13px;font:600 12.5px/1 inherit;color:#2f5446;cursor:pointer;transition:.28s cubic-bezier(.2,.8,.2,1)}
.pbtn:hover:not(:disabled){background:#fff;color:#0b7a3d;transform:translateY(-1px);box-shadow:0 12px 22px -18px rgba(11,122,61,.9)}
.pbtn:disabled{opacity:.38;cursor:default}
.pnum{min-width:34px;height:34px;display:grid;place-items:center;border-radius:11px;border:1px solid rgba(255,255,255,.88);
  background:rgba(255,255,255,.58);font:600 12.5px/1 inherit;color:#3c5d50;cursor:pointer;transition:.28s}
.pnum:hover{background:#fff;color:#0b7a3d;transform:translateY(-1px)}
.pnum.on{background:linear-gradient(140deg,#2fd683,#0b8a4a);color:#fff;border-color:transparent;cursor:default;
  box-shadow:0 12px 22px -14px rgba(11,138,74,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.pgap{min-width:22px;text-align:center;color:#9db1a7;font-size:12px}
.pinfo{font-size:11.5px;color:#8ba096;margin-left:8px;letter-spacing:.2px}
.pinfo b{color:#3d6353;font-weight:600}

/* 骨架 */
.skel{display:flex;flex-direction:column;gap:11px}
.srow{height:104px;border-radius:21px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.6);overflow:hidden;position:relative}
.srow::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sline{height:9px;border-radius:5px;background:rgba(120,160,145,.16);margin:22px 22px 0}
.sline.s2{width:42%;height:14px;margin-top:0;background:rgba(30,120,80,.14)}
.sline.s3{width:72%;margin-top:12px}
.sline.s4{width:55%;margin-top:9px}

/* 侧栏 */
.rail{display:flex;flex-direction:column;gap:13px;position:sticky;top:0;align-self:start}
.panel{padding:17px 18px 18px;border-radius:22px}
.panel h4{margin:0 0 12px;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:#7d968b;display:flex;align-items:center;gap:7px;font-weight:600}
.panel h4 .dot{width:6px;height:6px;border-radius:50%;background:#12a150}
.big-num{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.big-num b{font-size:32px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(120deg,#0b8a4a,#28cf88);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.big-num span{font-size:12px;color:#69837a}
.mini-note{font-size:11.5px;color:#8aa094;line-height:1.7;margin:8px 0 0}
.rows{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.row{display:flex;justify-content:space-between;font-size:12px;color:#6d867b;padding-bottom:8px;border-bottom:1px dashed rgba(20,70,55,.09)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row b{color:#1e4436;font-weight:600;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-wrap:wrap;gap:7px}
.hist .h{font-size:12px;color:#3f5f52;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:6px 11px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.24s}
.hist .h:hover{background:#fff;color:#0b7a3d;transform:translateY(-1px)}
.hist .empty{font-size:11.5px;color:#9aaea4}

/* 错误状态 */
.state-card{max-width:640px;margin:56px auto;padding:30px 32px;border-radius:26px;text-align:center;animation:fadeUp .5s both}
.state-ico{width:52px;height:52px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(230,245,238,.8));border:1px solid #fff;box-shadow:0 14px 30px -20px rgba(12,70,50,.6);font-size:22px}
.state-card h3{margin:0 0 8px;font-size:18px;font-weight:700}
.state-card p{margin:0 auto 20px;font-size:13px;line-height:1.8;color:#6a837a;max-width:460px}
.btn{border:1px solid rgba(255,255,255,.9);background:linear-gradient(135deg,#2fd683,#0b8a4a);color:#fff;font:600 13px/1 inherit;
  padding:12px 22px;border-radius:999px;cursor:pointer;box-shadow:0 14px 26px -14px rgba(11,138,74,.8);transition:.3s;margin:0 5px 8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.btn.ghost{background:rgba(255,255,255,.65);color:#1e4a39;box-shadow:0 10px 22px -18px rgba(12,70,50,.6)}
.btn.ghost:hover{background:#fff}

/* 网页视图 */
.webview{height:100%;display:flex;flex-direction:column;gap:9px;animation:fadeUp .4s both}
.web-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:16px;font-size:12px;color:#4e6b5f}
.web-bar .u{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#6a837a}
.web-frame{flex:1;min-height:420px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.8);background:#fff;box-shadow:var(--shadow)}
.web-frame iframe{width:100%;height:100%;border:0;display:block}
.web-hint{font-size:11.5px;color:#8fa49a;text-align:center}

/* 通道自检 */
.diag{margin:16px auto 0;max-width:420px;display:flex;flex-direction:column;gap:6px;text-align:left}
.diag-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 11px;
  border-radius:9px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);color:#4b6a5d}
.diag-row b{font-weight:600}
.diag-ok{color:#0b7a3d}
.diag-no{color:#b1584f}
.diag-tip{font-size:11.5px;color:#82988d;line-height:1.7;margin-top:4px}

/* 自定义中转 */
.relay-set{display:flex;gap:8px;max-width:460px;margin:16px auto 6px;align-items:center}
.relay-input{flex:1;min-width:0;padding:9px 13px;font-size:12px;color:#14342a;border-radius:10px;
  border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);outline:none;font-family:inherit}
.relay-input:focus{border-color:rgba(20,150,100,.45);background:rgba(255,255,255,.8)}

/* 提示条 */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:20;opacity:0;pointer-events:none;
  padding:11px 18px;border-radius:999px;font-size:12.5px;color:#14342a;transition:.35s cubic-bezier(.2,.8,.2,1);
  background:rgba(255,255,255,.82);border:1px solid #fff;backdrop-filter:blur(20px);box-shadow:0 18px 40px -22px rgba(12,70,50,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 响应式 */
@media (max-width:980px){
  .results-wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;flex-wrap:wrap}
  .rail .panel{flex:1 1 260px}
  .brand i,.kbd{display:none}
}
@media (max-width:640px){
  .app{padding:10px 12px;gap:9px}
  .brand b{display:none}
  .switch .txt{display:none}
  .hero-title{margin-top:14px}
  .searchbox input{font-size:14px}
  .sbtn{padding:0 14px}
}
@media (max-width:480px){
  .app{padding:10px 10px}
  .navbar{gap:6px;padding:8px 9px}
  .navbtn:nth-of-type(2){display:none}
  .addr{height:40px;padding:0 4px 0 8px}
  .addr .shield{width:22px;height:22px;border-radius:8px}
  .switch{padding:6px 8px}
  .searchbox{width:100%;padding:5px 6px;border-radius:24px}
  .searchbox .bing{padding:0 7px;height:34px}
  .searchbox .bing span{display:none}
  .sbtn{height:38px;padding:0 14px;border-radius:19px}
  .hero-title{font-size:clamp(26px,8.4vw,38px)}
  .hero-sub{font-size:12.5px}
  .chips{gap:7px}
  .chip{font-size:12px;padding:7px 12px}
}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<div class="vignette"></div>
<div class="grain"></div>

<div class="app">
  <!-- 标签栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div>
        <b>Shan-Web</b><br>
        <i>glass browser</i>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="newtab" id="newtab" title="新标签页 (Ctrl+T)">＋</button>
  </div>

  <!-- 导航栏 -->
  <div class="navbar glass">
    <button class="navbtn" id="back" title="后退">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="navbtn" id="fwd" title="前进">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="navbtn" id="reload" title="刷新">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-3.2-6.9"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="navbtn" id="home" title="主页">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-8 9 8"/><path d="M6 10v10h12V10"/></svg>
    </button>

    <div class="addr" id="addrWrap">
      <span class="shield" title="无广告通道">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="输入搜索内容，或粘贴网址">
      <span class="kbd">Enter</span>
      <button class="go" id="go" title="搜索">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
    </div>

    <div class="switch" id="adSwitch" title="切换广告过滤">
      <div class="track" id="track"><div class="knob"></div></div>
      <div class="txt">广告过滤 <b id="adTxt">ON</b></div>
    </div>
  </div>

  <!-- 主舞台 -->
  <div class="stage" id="stage"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var $ = function(s){ return document.querySelector(s); };
  var stage = $('#stage'), tabsEl = $('#tabs'), addr = $('#addr');

  var SUGGEST = ['液态玻璃 UI 设计','Bing 搜索 技巧','重庆 今日天气','大疆 Avata 2 参数','Noto Sans SC 字体'];
  var PROXIES = [
    { build: function(u){ return u; } },
    { build: function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); } },
    { build: function(u){ return 'https://api.allorigins.win/get?url=' + encodeURIComponent(u); }, json: true },
    { build: function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); } },
    { build: function(u){ return 'https://api.cors.lol/?url=' + encodeURIComponent(u); } },
    { build: function(u){ return 'https://cors.eu.org/' + u; } }
  ];
  var relayTpl = '';   // 用户自填中转，含 {url} 占位符

  /* ---------- 本地存储 ---------- */
  function load(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  }
  function save(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  var historyList = load('shanweb.history', []);
  var adblock = load('shanweb.adblock', true);
  var totalBlocked = load('shanweb.totalBlocked', 0);
  relayTpl = load('shanweb.relay', '') || '';

  /* ---------- 状态 ---------- */
  var state = { tabs: [], active: 0, seq: 1 };

  function makeTab(){
    return {
      id: state.seq++,
      title: '新标签页',
      trail: [{ type: 'home' }],
      pos: 0,
      status: 'idle',      // idle | loading | ready | error
      results: [],
      blocked: 0,
      channel: '',
      page: 1,
      pageCount: 0,
      pageCache: {},
      error: '',
      took: 0,
      query: ''
    };
  }

  function activeTab(){ return state.tabs[state.active]; }
  function current(){ var t = activeTab(); return t.trail[t.pos]; }

  /* ---------- 工具 ---------- */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function domainOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; }
  }
  function hueOf(str){
    var h = 0;
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 360; }
    return h;
  }
  function favi(url, title){
    var d = domainOf(url);
    var ch = (d.replace(/[^a-z0-9]/gi,'')[0] || (title||'?')[0] || '?').toUpperCase();
    var h = hueOf(d);
    return '<span class="favi" style="background:linear-gradient(140deg,hsl('+h+',68%,58%),hsl('+(h+28)+',70%,44%))">'+esc(ch)+'</span>';
  }
  function cleanUrl(href){
    if(!href) return '';
    try{
      var u = new URL(href, 'https://www.bing.com');
      if(u.pathname.indexOf('/ck/a') === 0){
        var p = u.searchParams.get('u');
        if(p && p.slice(0,2) === 'a1'){
          var s = p.slice(2).replace(/-/g,'+').replace(/_/g,'/');
          while(s.length % 4) s += '=';
          try{ return decodeURIComponent(escape(atob(s))); }catch(e){ try{ return atob(s); }catch(e2){ return href; } }
        }
      }
      if(u.hostname === 'www.bing.com' && u.pathname === '/search') return href;
      return u.href;
    }catch(e){ return href; }
  }
  function isUrlLike(str){
    str = str.trim();
    if(/\s/.test(str)) return false;
    return /^https?:\/\//i.test(str) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(str);
  }
  function normalizeUrl(str){
    str = str.trim();
    if(!/^https?:/i.test(str)) str = 'https://' + str;
    return str;
  }

  var toastTimer;
  function toast(msg){
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  /* ---------- 网络 ---------- */
  function fetchText(url, ms, headers){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, ms);
    var opts = { signal: ctrl.signal, credentials: 'omit', cache: 'no-store' };
    if(headers) opts.headers = headers;
    return fetch(url, opts)
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(t){ clearTimeout(timer); return t; })
      .catch(function(e){ clearTimeout(timer); throw e; });
  }

  function parseBing(html, wantAds){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var nodes = Array.prototype.slice.call(doc.querySelectorAll('#b_results > li'));
    var results = [], blocked = 0, seen = {};

    nodes.forEach(function(li){
      var cls = li.className || '';
      var labelEl = li.querySelector('.b_adlabel, .b_ads');
      var label = labelEl ? (labelEl.textContent || '').trim() : '';
      var isAd = /(^|\s)b_ad(\s|$)/.test(cls) || /b_adTr/.test(cls) || /赞助|广告|Sponsored/i.test(label);
      if(/b_pag/.test(cls)) return;

      var a = li.querySelector('h2 a');
      if(!a){ return; }
      if(isAd){
        blocked++;
        if(!wantAds) return;
      }

      var title = (a.textContent || '').trim();
      if(!title) return;
      var url = cleanUrl(a.getAttribute('href'));
      if(!url || url.indexOf('javascript:') === 0) return;
      if(seen[url]) return;
      seen[url] = 1;

      var citeEl = li.querySelector('.b_attribution cite') || li.querySelector('cite');
      var display = citeEl ? (citeEl.textContent || '').trim() : domainOf(url);

      var snipEl = li.querySelector('.b_caption p') || li.querySelector('p.b_lineclamp4') || li.querySelector('.b_snippet');
      var snippet = snipEl ? (snipEl.textContent || '').trim().replace(/\s+/g,' ') : '';
      if(snippet.length > 210) snippet = snippet.slice(0, 208) + '…';

      results.push({ title: title, url: url, display: display.replace(/^https?:\/\//,'').replace(/\/$/,''), snippet: snippet, ad: !!isAd });
    });

    return { results: results, blocked: blocked };
  }

  function stripTags(s){
    var d = document.createElement('div');
    d.innerHTML = s;
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function parseRSS(xml){
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('RSS 解析失败');
    var items = Array.prototype.slice.call(doc.querySelectorAll('item'));
    var results = [], seen = {};

    items.forEach(function(it){
      var titleEl = it.querySelector('title');
      var linkEl = it.querySelector('link');
      var title = titleEl ? (titleEl.textContent || '').trim() : '';
      var href = linkEl ? (linkEl.textContent || '').trim() : '';
      if(!title || !href) return;
      var url = cleanUrl(href);
      if(seen[url]) return;
      seen[url] = 1;

      var descEl = it.querySelector('description');
      var snippet = descEl ? stripTags(descEl.textContent || '') : '';
      if(snippet.length > 210) snippet = snippet.slice(0, 208) + '…';

      results.push({ title: title, url: url, display: domainOf(url), snippet: snippet, ad: false });
    });

    return { results: results, blocked: 0, channel: 'rss' };
  }

  function fetchProxied(target, ms){
    var list = PROXIES.slice();
    if(relayTpl){
      list.unshift({ build: function(u){
        return relayTpl.indexOf('{url}') >= 0
          ? relayTpl.replace('{url}', encodeURIComponent(u))
          : relayTpl + u;
      } });
    }
    var attempts = list.map(function(p){
      var url = p.build(target);
      return fetchText(url, ms).then(function(body){
        if(p.json){
          try{
            var j = JSON.parse(body);
            body = (j && (j.contents || j.body)) || '';
          }catch(e){ throw new Error('JSON 无效'); }
          if(typeof body !== 'string') throw new Error('空内容');
        }
        body = body.trim();
        if(body.length < 200) throw new Error('内容过短');
        return body;
      });
    });

    return new Promise(function(resolve, reject){
      var settled = false, failed = 0;
      attempts.forEach(function(pr){
        pr.then(function(body){
          if(!settled){ settled = true; resolve(body); }
        }).catch(function(){
          failed++;
          if(!settled && failed === attempts.length) reject(new Error('所有跨域通道均不可用'));
        });
      });
    });
  }

  var PAGE_SIZE = 15;

  function bingPageUrl(q, first){
    return 'https://cn.bing.com/search?q=' + encodeURIComponent(q) +
           '&first=' + first + '&setlang=zh-Hans&mkt=zh-CN&form=QBLH';
  }

  /* Jina 搜索接口：服务端抓取 + CORS，直接返回结构化结果，无推广位 */
  function jinaFetch(q){
    var url = 'https://s.jina.ai/' + encodeURIComponent(q);
    return fetchText(url, 12000, { 'Accept': 'application/json' }).then(function(txt){
      var j;
      try{ j = JSON.parse(txt); }catch(e){ throw new Error('Jina 返回非 JSON'); }
      var arr = (j && j.data) || [];
      var results = [], seen = {};
      arr.forEach(function(it){
        if(!it || !it.url || !it.title) return;
        var link = cleanUrl(it.url);
        if(!link || seen[link]) return;
        seen[link] = 1;
        var snip = stripTags(it.description || '');
        if(snip.length > 210) snip = snip.slice(0, 208) + '…';
        results.push({ title: it.title, url: link, display: domainOf(link), snippet: snip, ad: false });
      });
      if(!results.length) throw new Error('Jina 没有返回结果');
      return { results: results.slice(0, PAGE_SIZE), blocked: 0, channel: 'jina', hasMore: false };
    });
  }

  /* 每页 15 个网站：一次抓两个 10 条批次，去重后截取 15 条 */
  function collectPage(q, page){
    var wantAds = !adblock;
    var start = (page - 1) * PAGE_SIZE + 1;

    function batch(first){
      return fetchProxied(bingPageUrl(q, first), 7000).then(function(html){
        var data = parseBing(html, wantAds);
        if(!data.results.length) throw new Error('空批次');
        return data;
      }).catch(function(){ return null; });
    }

    var a = batch(start);
    var b = batch(start + 10);

    return Promise.all([a, b]).then(function(pairs){
      var merged = [], seen = {}, blocked = 0;
      pairs.forEach(function(p){
        if(!p) return;
        blocked += p.blocked || 0;
        p.results.forEach(function(r){
          if(seen[r.url]) return;
          seen[r.url] = 1;
          merged.push(r);
        });
      });
      if(!merged.length) throw new Error('未能解析 Bing 页面');
      return {
        results: merged.slice(0, PAGE_SIZE),
        blocked: blocked,
        hasMore: merged.length > PAGE_SIZE,
        channel: wantAds ? 'html' : 'html-filtered'
      };
    }).catch(function(){
      if(page > 1) throw new Error('这一页没有更多结果了');
      return jinaFetch(q);
    }).catch(function(e){
      throw new Error(e.message || '网络不可用');
    });
  }

  /* ---------- 历史 ---------- */
  function pushHistory(q){
    historyList = [q].concat(historyList.filter(function(x){ return x !== q; })).slice(0, 14);
    save('shanweb.history', historyList);
  }

  /* ---------- 操作 ---------- */
  function renderTabs(){
    tabsEl.innerHTML = state.tabs.map(function(t, i){
      var cls = 'tab' + (i === state.active ? ' active' : '') + (t.status === 'loading' ? ' loading' : '');
      return '<div class="' + cls + '" data-i="' + i + '">' +
               '<span class="dot"></span>' +
               '<span class="name">' + esc(t.title) + '</span>' +
               '<span class="x" data-close="' + i + '" title="关闭">✕</span>' +
             '</div>';
    }).join('');
  }

  function syncAddress(){
    var t = activeTab(), cur = current();
    if(!t) return;
    if(cur.type === 'search') addr.value = cur.q;
    else if(cur.type === 'web') addr.value = cur.url;
    else addr.value = '';
    $('#back').disabled = t.pos <= 0;
    $('#fwd').disabled = t.pos >= t.trail.length - 1;
    $('#adTxt').textContent = adblock ? 'ON' : 'OFF';
    $('#track').classList.toggle('off', !adblock);
  }

  function render(){
    renderTabs();
    syncAddress();
    var t = activeTab();
    if(!t) return;
    var cur = current();

    if(cur.type === 'home'){ stage.innerHTML = renderHome(); bindHome(); return; }

    if(cur.type === 'web'){ stage.innerHTML = renderWeb(cur); return; }

    // search
    if(t.status === 'loading'){ stage.innerHTML = renderResultsShell(t, true); return; }
    if(t.status === 'error'){ stage.innerHTML = renderError(t, cur.q); bindError(cur.q); return; }
    stage.innerHTML = renderResultsShell(t, false);
  }

  function renderHome(){
    var t = activeTab();
    var looks = '';
    if(t) {}
    var chips = [];
    var pool = historyList.length ? historyList.slice(0,7) : SUGGEST;
    pool.slice(0,7).forEach(function(h){
      chips.push('<button class="chip" data-chip="' + esc(h) + '">' + esc(h) + '</button>');
    });

    return '<div class="home">' +
      '<span class="eyebrow"><span class="live"></span> Bing 引擎 · 广告拦截已开启</span>' +
      '<h1 class="hero-title">干净一点的<br><em>搜索</em>体验</h1>' +
      '<p class="hero-sub">液态玻璃外壳 / Bing 真实结果 / 每页 15 个网站</p>' +
      '<div class="searchbox" id="heroBox"><span class="sheen"></span>' +
        '<div class="bing"><span class="bing-mark">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
        '</span><span style="font-size:12px;color:#4d6b5e;font-weight:600;letter-spacing:.7px">BING</span></div>' +
        '<input id="heroInput" type="text" spellcheck="false" autocomplete="off" placeholder="搜索点什么，广告交给我">' +
        '<button class="sbtn" id="heroGo">搜索</button>' +
      '</div>' +
      '<div class="chips">' + chips.join('') + '</div>' +
      '<div class="stats">' +
        '<span class="s"><b>' + totalBlocked + '</b> 累计拦截广告</span>' +
        '<span class="s"><b>Bing</b> 自然结果</span>' +
        '<span class="s"><b>15</b> 个网站 / 页</span>' +
      '</div>' +
    '</div>';
  }

  /* ---------- 结果卡片 ---------- */
  function resultCard(r, i){
    var delay = Math.min(i, 9) * 42;
    return '<div class="rcard" data-url="' + esc(r.url) + '" style="animation-delay:' + delay + 'ms">' +
      '<div class="src-line">' + favi(r.url, r.title) +
        '<span class="src">' + esc(r.display) + '</span>' +
        (r.ad ? '<span class="adbadge">广告</span>' : '') +
      '</div>' +
      '<h3 class="rtitle">' + esc(r.title) + '</h3>' +
      '<p class="rsnip">' + (r.snippet ? esc(r.snippet) : '打开查看这条结果') + '</p>' +
      '<span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></span>' +
    '</div>';
  }

  function railHtml(t){
    var hist = historyList.length
      ? historyList.slice(0, 11).map(function(h){ return '<span class="h" data-chip="' + esc(h) + '">' + esc(h) + '</span>'; }).join('')
      : '<span class="empty">还没有搜索记录</span>';

    var pure = t.channel === 'jina';
    var headline = pure
      ? '<div class="big-num"><b>' + t.results.length + '</b><span>条纯净结果</span></div>'
      : '<div class="big-num"><b>' + t.blocked + '</b><span>条广告已移除</span></div>';
    var note = pure
      ? '这条链路把查询交给服务端索引接口，取回的就是自然结果，没有推广位。'
      : (adblock
        ? '已把赞助卡片、推广位整块丢弃，只保留自然排序条目。'
        : '广告过滤已关闭，赞助条目会带「广告」标记一并显示。');
    var channelName = pure ? '服务端索引 · 纯净' : (t.channel === 'html-filtered' ? '网页解析 · 已净化' : '网页原始');
    if(t.results.length < 15 && (t.pageCount || 1) <= 1){
      note += ' 当前通道这次只交回 ' + t.results.length + ' 条。';
    }

    return '<aside class="rail">' +
      '<div class="panel glass"><h4><span class="dot"></span>过滤报告</h4>' +
        headline +
        '<p class="mini-note">' + note + '</p>' +
        '<div class="rows">' +
          '<div class="row"><span>引擎</span><b>Bing 网页</b></div>' +
          '<div class="row"><span>通道</span><b>' + channelName + '</b></div>' +
          '<div class="row"><span>每页网站</span><b>15 个</b></div>' +
          '<div class="row"><span>当前页</span><b>' + (t.page || 1) + ' / ' + Math.max(t.pageCount || 1, t.page || 1) + '</b></div>' +
          '<div class="row"><span>本页结果</span><b>' + t.results.length + ' 条</b></div>' +
          '<div class="row"><span>抓取耗时</span><b>' + (t.took ? (t.took / 1000).toFixed(2) + ' s' : '—') + '</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="panel glass"><h4><span class="dot"></span>最近搜索</h4><div class="hist">' + hist + '</div></div>' +
      '<div class="panel glass"><h4><span class="dot"></span>快捷键</h4>' +
        '<div class="rows">' +
          '<div class="row"><span>新标签页</span><b>Ctrl / ⌘ + T</b></div>' +
          '<div class="row"><span>聚焦地址栏</span><b>Ctrl / ⌘ + L</b></div>' +
          '<div class="row"><span>关闭标签页</span><b>Ctrl / ⌘ + W</b></div>' +
        '</div>' +
      '</div>' +
    '</aside>';
  }

  function pagerHtml(t){
    if(t.status !== 'ready' || !t.results.length) return '';
    var page = t.page || 1;
    var count = Math.max(t.pageCount || 1, page);
    var shown = [], i;
    for(i = 1; i <= count; i++){
      if(count > 7 && i > 2 && i < count - 1 && Math.abs(i - page) > 1){
        if(shown[shown.length - 1] !== 'gap') shown.push('gap');
        continue;
      }
      shown.push(i);
    }
    var nums = shown.map(function(v){
      if(v === 'gap') return '<span class="pgap">…</span>';
      var on = v === page;
      return '<button class="pnum' + (on ? ' on"' : '"') + ' data-page="' + v + '">' + v + '</button>';
    }).join('');

    return '<nav class="pager">' +
      '<button class="pbtn" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹ 上一页</button>' +
      nums +
      '<button class="pbtn" data-page="' + (page + 1) + '"' + (page >= count ? ' disabled' : '') + '>下一页 ›</button>' +
      '<span class="pinfo">第 <b>' + page + '</b> 页 · 每页 <b>15</b> 个网站</span>' +
    '</nav>';
  }

  function renderResultsShell(t){
    var cur = current();
    var q = cur.type === 'search' ? cur.q : '';
    var page = t.page || 1;
    var body;

    if(t.status === 'loading'){
      var row = '<div class="srow"><div class="sline s2"></div><div class="sline s3"></div><div class="sline s4"></div></div>';
      body = '<div class="skel">' + row + row + row + row + '</div>';
    } else if(!t.results.length){
      body = '<div class="state-card glass" style="margin-top:20px">' +
        '<div class="state-ico">⌕</div>' +
        '<h3>' + (page > 1 ? '这一页已经到底了' : '这个查询没带回结果') + '</h3>' +
        '<p>' + (page > 1
          ? '第 ' + page + ' 页没有更多网站，回到上一页继续看，或直接在 Bing 里翻。'
          : '可能命中率太低，或代理通道返回了不完整的页面。换个说法，或直接去 Bing 看。') + '</p>' +
        (page > 1 ? '<button class="btn" data-page="' + (page - 1) + '">‹ 回到第 ' + (page - 1) + ' 页</button>' : '') +
        '<button class="btn ghost" data-act="bing">在 Bing 打开</button>' +
        '<button class="btn ghost" data-act="retry">再试一次</button></div>';
    } else {
      body = '<div class="results-list">' + t.results.map(resultCard).join('') + '</div>' + pagerHtml(t);
    }

    return '<div class="results-wrap"><div>' +
      '<div class="results-head">' +
        '<h2>关于 <span class="q">' + esc(q) + '</span></h2>' +
        '<span class="verdict">' +
          (t.channel === 'jina'
            ? '✓ 纯净源 · 无推广位'
            : (t.channel === 'html-filtered'
              ? '✓ 已过滤 ' + t.blocked + ' 条广告'
              : '· 原始结果 · 含推广标记')) +
        '</span>' +
        '<span class="meta">' + (t.status === 'ready'
          ? '第 ' + page + ' 页 · 每页 15 个网站'
          : '正在抓取第 ' + page + ' 页…') + '</span>' +
      '</div>' + body + '</div>' + railHtml(t) + '</div>';
  }

  /* ---------- 网页视图 ---------- */
  function renderWeb(entry){
    var u = entry.url;
    var isBing = u.indexOf('bing.com/search') >= 0;
    return '<div class="webview">' +
      '<div class="web-bar glass">' +
        '<span style="font-weight:600;color:#0b7a3d;flex:none">' + (isBing ? 'Bing 原页 · 含推广' : '外部页面') + '</span>' +
        '<span class="u">' + esc(u) + '</span>' +
        '<button class="btn ghost" style="padding:8px 15px;margin:0;flex:none" data-act="openweb" data-url="' + esc(u) + '">新窗口打开</button>' +
      '</div>' +
      '<div class="web-frame"><iframe src="' + esc(u) + '" referrerpolicy="no-referrer"></iframe></div>' +
      '<p class="web-hint">' + (isBing
        ? '这是 Bing 自己的页面，自带推广位没有被清理；点「上一页」可回到无广告的结构化结果。'
        : '出于安全策略，不少站点会拒绝被嵌入。上方若空白，请点「新窗口打开」。') + '</p>' +
    '</div>';
  }

  function renderError(t){
    return '<div class="state-card glass">' +
      '<div class="state-ico">!</div>' +
      '<h3>这次没连上 Bing</h3>' +
      '<p>跨域中转在你的网络没走通（' + esc(t.error || '网络错误') + '）。可以重试、做一次通道自检，或者填上你自己的中转地址。</p>' +
      '<div class="relay-set">' +
        '<input id="relayInput" class="relay-input" placeholder="自定义中转，用 {url} 占位，例如 https://你的域名/?url={url}" value="' + esc(relayTpl) + '">' +
        '<button class="btn ghost" style="padding:8px 14px;margin:0;flex:none" data-act="saverelay">保存</button>' +
      '</div>' +
      '<button class="btn" data-act="retry">重新尝试</button>' +
      '<button class="btn ghost" data-act="bing">在 Bing 打开</button>' +
      '<button class="btn ghost" data-act="orig">用 Bing 原页打开</button>' +
      '<button class="btn ghost" data-act="diag">通道自检</button>' +
      '<div id="diagBox" class="diag"></div>' +
    '</div>';
  }

  function runDiagnostics(){
    var box = document.getElementById('diagBox');
    if(!box) return;
    box.innerHTML = '<div class="diag-row"><span>正在逐个检测通道…</span><b>…</b></div>';

    var rows = [];
    var checks = [
      { name: '服务端索引', url: 'https://s.jina.ai/liquid%20glass%20design', headers: { 'Accept': 'application/json' } },
      { name: 'allorigins', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://example.com') },
      { name: 'codetabs', url: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://example.com') },
      { name: 'cors.lol', url: 'https://api.cors.lol/?url=' + encodeURIComponent('https://example.com') }
    ];
    if(relayTpl){
      checks.push({ name: '自定义中转', url: relayTpl.indexOf('{url}') >= 0
        ? relayTpl.replace('{url}', encodeURIComponent('https://example.com'))
        : relayTpl + 'https://example.com' });
    }

    function paint(){
      box.innerHTML = rows.map(function(r){
        return '<div class="diag-row"><span>' + esc(r.name) + '</span><b class="' +
          (r.ok ? 'diag-ok' : 'diag-no') + '">' + (r.ok ? '可用' : '不可达') + '</b></div>';
      }).join('') + (rows.length === checks.length
        ? '<div class="diag-tip">' + (rows.some(function(r){ return r.ok; })
            ? '有通道可用，重试搜索即可。若「服务端索引」可用，即使其他都不可达也能出结果。'
            : '全部不可达：当前网络限制了这些中转服务，可以填上你自己的中转，或直接用 Bing。') + '</div>'
        : '');
    }

    var chain = Promise.resolve();
    checks.forEach(function(c){
      chain = chain.then(function(){
        return fetchText(c.url, 8000, c.headers).then(function(body){
          var bad = !body || body.length < 80 || body.indexOf('success":false') >= 0;
          rows.push({ name: c.name, ok: !bad });
        }).catch(function(){
          rows.push({ name: c.name, ok: false });
        }).then(paint);
      });
    });
  }

  /* ---------- 交互绑定 ---------- */
  function bindHome(){
    var input = document.getElementById('heroInput');
    var box = document.getElementById('heroBox');
    var goBtn = document.getElementById('heroGo');
    if(!input || !goBtn) return;

    goBtn.addEventListener('click', function(){ submit(input.value); });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); submit(input.value); }
    });

    if(box){
      box.addEventListener('pointermove', function(e){
        var r = box.getBoundingClientRect();
        box.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
        box.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
      });
    }

    setTimeout(function(){
      if(document.activeElement !== addr){
        try{ input.focus({ preventScroll: true }); }catch(err){ input.focus(); }
      }
    }, 60);
  }

  function bindError(){ /* 按钮统一走 stage 代理 */ }

  /* ---------- 导航 ---------- */
  function bingUrl(q){
    return 'https://www.bing.com/search?q=' + encodeURIComponent(q || '');
  }

  function submit(raw){
    var v = (raw || '').trim();
    if(!v) return;
    if(isUrlLike(v)) openWeb(v);
    else newSearch(v);
  }

  function openWeb(raw){
    var t = activeTab();
    var url = normalizeUrl(raw);
    t.trail = t.trail.slice(0, t.pos + 1);
    t.trail.push({ type: 'web', url: url });
    t.pos = t.trail.length - 1;
    t.status = 'ready';
    t.title = domainOf(url);
    t.query = '';
    render();
    stage.scrollTop = 0;
  }

  function newSearch(q){
    q = (q || '').trim();
    if(!q) return;
    var t = activeTab();
    t.trail = t.trail.slice(0, t.pos + 1);
    t.trail.push({ type: 'search', q: q });
    t.pos = t.trail.length - 1;
    t.query = q;
    t.title = q.length > 22 ? q.slice(0, 22) + '…' : q;
    t.page = 1;
    t.pageCount = 0;
    pushHistory(q);
    loadPage(1);
    stage.scrollTop = 0;
    addr.blur();
  }

  function loadPage(p){
    var t = activeTab();
    var entry = t.trail[t.pos];
    if(!entry || entry.type !== 'search') return;
    var q = entry.q;
    p = Math.max(1, p || 1);
    var cache = entry.pageCache || (entry.pageCache = {});
    var cached = cache[p];

    if(cached){
      t.status = 'ready';
      t.page = p;
      t.results = cached.results;
      t.blocked = cached.blocked;
      t.channel = cached.channel;
      t.took = cached.took;
      render();
      stage.scrollTop = 0;
      return;
    }

    t.status = 'loading';
    t.page = p;
    t.results = [];
    t.blocked = 0;
    t.channel = '';
    t.took = 0;
    render();

    var now = function(){ return (window.performance && performance.now) ? performance.now() : Date.now(); };
    var started = now();

    collectPage(q, p).then(function(data){
      if(t.trail[t.pos] !== entry || t.page !== p) return;
      data.took = Math.round(now() - started);
      cache[p] = data;

      t.status = 'ready';
      t.results = data.results;
      t.blocked = data.blocked;
      t.channel = data.channel || 'html-filtered';
      t.took = data.took;
      t.page = p;

      if(p === 1){
        t.pageCount = data.hasMore ? 5 : 1;
      } else if(data.hasMore){
        t.pageCount = Math.max(t.pageCount || p, p + 1);
      } else {
        t.pageCount = p;
      }

      entry.results = data.results;
      entry.blocked = data.blocked;
      entry.channel = t.channel;
      entry.took = data.took;
      entry.page = p;
      entry.pageCount = t.pageCount;

      totalBlocked += data.blocked;
      save('shanweb.totalBlocked', totalBlocked);
      render();
      if(data.blocked > 0) toast('已移除 ' + data.blocked + ' 条广告，仅保留自然结果');
    }).catch(function(e){
      if(t.trail[t.pos] !== entry || t.page !== p) return;
      t.status = 'error';
      t.error = (e && e.message) ? e.message : '网络错误';
      render();
    });
  }

  function selectTrail(i){
    var t = activeTab();
    if(i < 0 || i >= t.trail.length) return;
    t.pos = i;
    var e = t.trail[i];
    if(e.type === 'search'){
      t.title = e.q.length > 22 ? e.q.slice(0, 22) + '…' : e.q;
      if(e.results){
        t.status = 'ready';
        t.results = e.results;
        t.blocked = e.blocked;
        t.channel = e.channel || 'html-filtered';
        t.took = e.took;
        t.page = e.page || 1;
        t.pageCount = e.pageCount || 1;
        render();
      } else {
        t.page = 1;
        t.pageCount = 0;
        loadPage(1);
      }
    } else if(e.type === 'web'){
      t.title = domainOf(e.url);
      t.status = 'ready';
      render();
    } else {
      t.title = '新标签页';
      t.status = 'idle';
      render();
    }
    stage.scrollTop = 0;
  }

  /* ---------- 标签 ---------- */
  function addTab(){
    state.tabs.push(makeTab());
    state.active = state.tabs.length - 1;
    render();
    addr.focus();
  }

  function closeTab(i){
    if(state.tabs.length === 1){
      state.tabs[0] = makeTab();
      state.active = 0;
      render();
      return;
    }
    state.tabs.splice(i, 1);
    if(state.active >= state.tabs.length) state.active = state.tabs.length - 1;
    else if(i < state.active) state.active--;
    render();
  }

  /* ---------- 事件 ---------- */
  tabsEl.addEventListener('click', function(e){
    var close = e.target.closest('[data-close]');
    if(close){
      e.stopPropagation();
      closeTab(parseInt(close.getAttribute('data-close'), 10));
      return;
    }
    var tabEl = e.target.closest('.tab');
    if(tabEl){
      state.active = parseInt(tabEl.getAttribute('data-i'), 10);
      render();
    }
  });

  stage.addEventListener('click', function(e){
    var t = activeTab();
    var pageBtn = e.target.closest('[data-page]');
    if(pageBtn){
      var n = parseInt(pageBtn.getAttribute('data-page'), 10);
      if(n && n !== t.page) loadPage(n);
      return;
    }

    var actEl = e.target.closest('[data-act]');
    if(actEl){
      var act = actEl.getAttribute('data-act');
      var cur = current();
      if(act === 'retry'){
        if(cur.type === 'search' && t.status !== 'loading') loadPage(t.page || 1);
      } else if(act === 'bing'){
        window.open(bingUrl(cur.type === 'search' ? cur.q : ''), '_blank', 'noopener');
      } else if(act === 'openweb'){
        window.open(actEl.getAttribute('data-url'), '_blank', 'noopener');
      } else if(act === 'diag'){
        runDiagnostics();
      } else if(act === 'saverelay'){
        var input = document.getElementById('relayInput');
        var v = input ? input.value.trim() : '';
        if(v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
        relayTpl = v;
        save('shanweb.relay', relayTpl);
        toast(relayTpl ? '中转已保存，正在重试' : '已清除自定义中转');
        if(cur.type === 'search'){ cur.pageCache = {}; loadPage(t.page || 1); }
      } else if(act === 'orig'){
        openWeb(bingUrl(cur.type === 'search' ? cur.q : ''));
      }
      return;
    }
    var chip = e.target.closest('[data-chip]');
    if(chip){ newSearch(chip.getAttribute('data-chip')); return; }
    var card = e.target.closest('.rcard');
    if(card){
      var url = card.getAttribute('data-url');
      if(url) window.open(url, '_blank', 'noopener');
    }
  });

  $('#back').addEventListener('click', function(){ selectTrail(activeTab().pos - 1); });
  $('#fwd').addEventListener('click', function(){ selectTrail(activeTab().pos + 1); });
  $('#reload').addEventListener('click', function(){
    var t = activeTab(), e = current();
    if(e.type === 'search'){
      if(t.status !== 'loading'){
        var cache = e.pageCache || (e.pageCache = {});
        delete cache[t.page || 1];
        loadPage(t.page || 1);
      }
    }
    else render();
  });
  $('#home').addEventListener('click', function(){
    var t = activeTab();
    t.trail = [{ type: 'home' }];
    t.pos = 0;
    t.status = 'idle';
    t.title = '新标签页';
    render();
  });
  $('#go').addEventListener('click', function(){ submit(addr.value); });
  $('#newtab').addEventListener('click', addTab);

  addr.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submit(addr.value); }
  });

  $('#adSwitch').addEventListener('click', function(){
    adblock = !adblock;
    save('shanweb.adblock', adblock);
    var t = activeTab(), e = current();
    if(e.type === 'search' && t.status !== 'loading'){
      e.pageCache = {};
      e.results = null;
      t.page = 1;
      t.pageCount = 0;
      loadPage(1);
    }
    else { syncAddress(); render(); }
    toast(adblock ? '广告过滤已开启' : '广告过滤已关闭（赞助条目会带标记）');
  });

  document.addEventListener('keydown', function(e){
    var meta = e.metaKey || e.ctrlKey;
    if(meta && (e.key === 't' || e.key === 'T')){ e.preventDefault(); addTab(); }
    else if(meta && (e.key === 'l' || e.key === 'L')){ e.preventDefault(); addr.focus(); addr.select(); }
    else if(meta && (e.key === 'w' || e.key === 'W')){ e.preventDefault(); closeTab(state.active); }
    else if(e.key === 'Escape' && document.activeElement === addr){ addr.blur(); }
  });

  /* ---------- 启动 ---------- */
  state.tabs.push(makeTab());
  state.active = 0;
  render();

})();
</script>
</body>
</html>
